<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이미지 크로퍼</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #f1f5f9, #dbeafe);
            color: #1e2937;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #2563eb, #1e40af);
            color: white;
        }
        h1 { font-size: 2.5rem; font-weight: 700; }

        .section { padding: 40px; text-align: center; }
        
        .upload-area {
            border: 3px dashed #94a3b8;
            border-radius: 16px;
            padding: 90px 40px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: #2563eb;
            background: #eff6ff;
            transform: scale(1.02);
        }

        #crop-container {
            margin: 30px auto;
            max-width: 820px;
            border: 4px solid #1e2937;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        .aspect-ratios {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 20px 0 30px 0;
        }
        .ratio-btn {
            padding: 10px 24px;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 9999px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .ratio-btn.active {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }

        .toolbar {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        button {
            padding: 12px 26px;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary { 
            background: #2563eb; 
            color: white; 
        }
        .btn-primary:hover { transform: translateY(-3px); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🖼️ 이미지 크로퍼</h1>
            <p>비율 선택 · 드래그 이동 · 마우스 휠 확대/축소</p>
        </header>
        
        <div class="section">
            <!-- 업로드 영역 -->
            <div class="upload-area" id="image-upload-area">
                <h3>JPG 또는 PNG 이미지를 끌어다 놓으세요</h3>
                <p style="color:#64748b; margin:12px 0;">또는</p>
                <button class="btn-primary" onclick="document.getElementById('image-input').click()">
                    이미지 선택
                </button>
                <input type="file" id="image-input" accept="image/jpeg, image/png" style="display:none;">
            </div>

            <!-- 편집 영역 -->
            <div id="image-editor" style="display:none;">
                <div class="aspect-ratios" id="aspect-ratios"></div>
                
                <div id="crop-container">
                    <img id="crop-image" alt="크롭할 이미지">
                </div>
                
                <div class="toolbar">
                    <button onclick="cropper.rotate(-90)">↩️ 90° 회전</button>
                    <button onclick="cropper.zoom(0.2)">🔍 확대</button>
                    <button onclick="cropper.zoom(-0.2)">🔍 축소</button>
                    <button onclick="resetCrop()">🔄 크롭 초기화</button>
                    <button onclick="applyCrop()" class="btn-primary">✅ 크롭해서 다운로드</button>
                    <button onclick="resetImage()" style="background:#64748b; color:white;">새 이미지</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let cropper = null;
        let currentAspectRatio = NaN; // 자유 비율

        const aspectRatios = [
            { label: "자유", ratio: NaN },
            { label: "1:1", ratio: 1 },
            { label: "16:9", ratio: 16/9 },
            { label: "9:16", ratio: 9/16 },
            { label: "4:3", ratio: 4/3 },
            { label: "3:2", ratio: 3/2 },
            { label: "5:4", ratio: 5/4 },
            { label: "2:3", ratio: 2/3 }
        ];

        function createRatioButtons() {
            const container = document.getElementById('aspect-ratios');
            container.innerHTML = '';
            
            aspectRatios.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'ratio-btn';
                btn.textContent = item.label;
                if (item.ratio === currentAspectRatio || (isNaN(item.ratio) && isNaN(currentAspectRatio))) {
                    btn.classList.add('active');
                }
                
                btn.onclick = () => {
                    document.querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentAspectRatio = item.ratio;
                    
                    if (cropper) {
                        cropper.setAspectRatio(item.ratio);
                    }
                };
                container.appendChild(btn);
            });
        }

        // 드래그 앤 드롭 + 파일 선택
        const uploadArea = document.getElementById('image-upload-area');
        uploadArea.addEventListener('dragover', e => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
        uploadArea.addEventListener('drop', e => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files[0]) loadImage(e.dataTransfer.files[0]);
        });

        document.getElementById('image-input').addEventListener('change', e => {
            if (e.target.files[0]) loadImage(e.target.files[0]);
        });

        function loadImage(file) {
            if (!file.type.startsWith('image/')) {
                alert('이미지 파일(JPG, PNG)만 업로드 가능합니다.');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = ev => {
                const img = document.getElementById('crop-image');
                img.src = ev.target.result;
                
                document.getElementById('image-upload-area').style.display = 'none';
                document.getElementById('image-editor').style.display = 'block';

                // 기존 cropper 제거
                if (cropper) cropper.destroy();

                // Cropper.js 초기화 (일반 사진 편집 앱처럼)
                cropper = new Cropper(img, {
                    aspectRatio: currentAspectRatio,
                    viewMode: 1,           // 이미지 영역을 벗어나지 않도록
                    dragMode: 'move',      // 이동 모드
                    autoCropArea: 0.9,     // 처음에 거의 전체 이미지 커버
                    responsive: true,
                    movable: true,
                    rotatable: true,
                    scalable: true,
                    zoomable: true,
                    zoomOnWheel: true,
                    wheelZoomRatio: 0.1,
                    cropBoxMovable: true,
                    cropBoxResizable: true,
                    toggleDragModeOnDblclick: true,
                    background: true,
                    guides: true,
                    center: true,
                    highlight: true,
                    minContainerWidth: 300,
                    minContainerHeight: 300
                });
            };
            reader.readAsDataURL(file);
        }

        function applyCrop() {
            if (!cropper) return;
            
            const canvas = cropper.getCroppedCanvas({
                maxWidth: 3000,
                maxHeight: 3000,
                imageSmoothingEnabled: true,
                imageSmoothingQuality: 'high'
            });

            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `크롭된_이미지_${new Date().toISOString().slice(0,10)}.png`;
                a.click();
                URL.revokeObjectURL(url);
            }, 'image/png', 0.95);
        }

        function resetCrop() {
            if (cropper) {
                cropper.reset();
            }
        }

        function resetImage() {
            if (cropper) cropper.destroy();
            document.getElementById('image-editor').style.display = 'none';
            document.getElementById('image-upload-area').style.display = 'block';
        }

        // 초기화
        window.onload = () => {
            createRatioButtons();
        };
    </script>
</body>
</html>
